[project]
name = "kokoro-vi-ngoc-huyen"
version = "0.1.0"
description = "Inference-only Vietnamese Kokoro TTS for Ngoc Huyen voice"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch",
    "numpy",
    "soundfile",
    "huggingface_hub",
    "transformers",
    "loguru",
    "misaki[en]>=0.9.4",
    "vig2p==0.1.0",
]

[project.optional-dependencies]
demo = ["gradio"]

[tool.setuptools]
py-modules = ["infer", "app"]
packages = ["kokoro"]
